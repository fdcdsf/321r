# 321r: карточки приложений для Telegram-бота. Правится руками — бот перечитывает
# файл при каждом показе (изменения видны сразу, без перезапуска).
#
# ВАЖНО: карточки — только УДОБНАЯ ГРУППИРОВКА. Всё живое бот показывает и без этого
# файла (авто-открытие): контейнеры (docker ps), swarm-сервисы (docker service ls),
# базы (/var/lib/dbdata/*), ноды (cluster.yml). Новое появится само; сюда добавляете,
# если хотите красивую карточку-группу.
#
# Поля: id (латиницей), title, desc, urls (через запятую), db (имя базы),
# containers (имена контейнеров через запятую), units (systemd-юниты через запятую).
apps:
  - id: pangolin
    title: 🧩 Pangolin — кластер туннелей
    desc: Ингресс 443 (gerbil), дашборд, сайты-агенты, ресурсы
    urls: https://pangolin.321r.ru/
    db: pangolin
    containers: pangolin, pg-pangolin, gerbil, traefik
    units: pangolin-site

  - id: xray
    title: 🧩 VPN-ноды (Xray и маскировка)
    desc: Ноды трафика remnanode, маски vpn-*/tg, Reality :2087 — то, чем пользуются люди
    urls: https://vpn-a.321r.ru/, https://vpn-b.321r.ru/, https://vpn-c.321r.ru/, https://tg.321r.ru/
    containers: remnanode

  - id: remnawave
    title: 🧩 Remnawave — панель VPN
    desc: Панель управления, страница подписок, БД панели
    urls: https://rem.321r.ru/
    db: remnawave
    containers: remnawave, remnawave-subscription-page, pg-remnawave

  - id: komodo
    title: 🧩 Komodo — управление стеками
    desc: Core (swarm-сервис), агенты periphery, БД mongo (RS + арбитр)
    urls: https://komodo.321r.ru/
    db: komodo
    containers: mongod-komodo
    units: periphery

  - id: mtproto
    title: 🧩 Telegram-прокси (mtproto)
    desc: Маска tg.321r.ru; egress из РФ — через mesh-шлюз на b
    urls: https://tg.321r.ru/
    units: mtproto-proxy
