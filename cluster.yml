# 321r · манифест кластера (генерирует install/install.sh из install/inventory.conf)
# Правится руками или через инвентарь; копия — на нодах в /etc/db/cluster.yml; секретов нет.
cluster: 321r
servers:
  - {name: a, ip: 45.12.237.234, geo: -, provider: -, size: l, role: state}
  - {name: b, ip: 45.147.176.79, geo: -, provider: -, size: l, role: work}
  - {name: c, ip: 62.113.96.7, geo: -, provider: -, size: l, role: bulk}
control: b   # «говорящая» нода бота (команды); алерты шлёт ЛЮБАЯ нода
apps:
  - {name: pangolin, engine: pg, replicas: 3, rule: "321"}
  - {name: remnawave, engine: pg, replicas: 3, rule: "321"}
  - {name: komodo, engine: mongo, replicas: 2, arbiter: 1, rule: "321"}
backup: {on: 2-other-domains, retention: {daily: 30, weekly: 12, monthly: 12}, export: telegram-monthly}
survival: {policy: manual-via-bot, auto_after: null}
