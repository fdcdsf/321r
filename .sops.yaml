# SOPS + age: шифрование секретов в git.
#
# Настройка (фаза 1, 2026-11-09):
#   1. Установлено: winget SecretsOPerationS.SOPS (sops 3.13.3), FiloSottile.age (age 1.3.2).
#   2. age-ключ сгенерирован в  %APPDATA%\sops\age\keys.txt
#      (стандартное место sops на Windows; на Linux — ~/.config/sops/age/keys.txt)
#      Секретная часть ключа -> в менеджер паролей И на распечатку. НИКОГДА в git и не в чат!
#   3. Публичный ключ (age1...) — в creation_rules ниже, им шифруются все файлы.
#
# Шифровать:  sops -e secrets/db.yaml > secrets/db.enc.yaml
# Читать:     sops -d secrets/db.enc.yaml
# В git идут только *.enc.yaml; открытые файлы в secrets/ — под запретом (.gitignore).
creation_rules:
  # YAML в каталоге secrets/ и *.env (токены) — шифруем нашим age-ключом.
  - path_regex: 'secrets[/\\].*\.ya?ml$'
    age: age199pnthu9g9plqhvjya87wg3shuc34jm6nz7lyn69vv97fjwg750qr0c3et
  - path_regex: '.*\.env$'
    age: age199pnthu9g9plqhvjya87wg3shuc34jm6nz7lyn69vv97fjwg750qr0c3et
