# Узел c (VPS-3) — AmneziaWG mesh 321r.ru, шаблон для раскатки (см. Пакет 2 в переписке).
# PrivateKey при раскатке подставляется из /etc/wireguard/privatekey (с ноды не уходит).
# HeaderProtectionKey — общий секрет кластера: реальное значение в /etc/amnezia/amneziawg/wg0.conf
# на любой ноде (в git не пишем до настройки SOPS).
[Interface]
PrivateKey = {{PRIVATE_KEY}}
Address = 10.66.0.3/32,10.66.0.99/32
ListenPort = 51821
Jc = 4
Jmin = 50
Jmax = 1000
S1 = 12
S2 = 12
S3 = 12
S4 = 12
HeaderProtectionKey = {{HEADER_KEY}}

[Peer]
PublicKey = 46ZWMy/69aj0rDp65ub7YqBI6heUc4lCP50P+aWbBx4=
Endpoint = a.321r.ru:51821
AllowedIPs = 10.66.0.1/32
